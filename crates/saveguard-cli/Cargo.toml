[package]
name = "saveguard-cli"
description = "Save standard input to a file without wrecking it: atomic when nothing would be lost, in place when something would."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["save", "sponge", "atomic", "file", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "saveguard"
path = "src/main.rs"

[dependencies]
saveguard = { path = "../saveguard", version = "0.1.0" }
